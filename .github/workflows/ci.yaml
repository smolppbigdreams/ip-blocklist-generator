# ==========================================
# Workflow Configuration
# ==========================================
name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "**.md"
      - "docs/**"

# Global Environment Variables
env:
  REGISTRY_HOST: ghcr.io
  REGISTRY_OWNER: ${{ github.repository_owner }}
  IMAGE_NAME: ip-blocklist-generator

# ==========================================
# Jobs Definition
# ==========================================
jobs:
  # ----------------------------------------
  # Job 1: Validation & Testing
  # ----------------------------------------
  validate:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Mise
        uses: jdx/mise-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dependencies
        run: mise run install

      - name: Run Validation
        run: mise run validate

      - name: Run Tests
        run: mise run test

  # ----------------------------------------
  # Job 2: Build & Push Container Image
  # ----------------------------------------
  container:
    needs: validate
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Mise
        uses: jdx/mise-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Container Image
        env:
          REGISTRY_HOST: ${{ env.REGISTRY_HOST }}
          REGISTRY_OWNER: ${{ env.REGISTRY_OWNER }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ github.sha }}
          ADD_LATEST_TAG: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}
          CI: "true"
        run: mise run build
