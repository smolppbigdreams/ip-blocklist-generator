[package]
name = "ip-blocklist-generator"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
ipnet = "2.12.1"
reqwest = { version = "0.13.4", features = ["rustls"], default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-retry = "0.3.2"
